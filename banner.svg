<svg width="1200" height="300" viewBox="0 0 1200 300" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Tkyo_0x — Full-stack Developer & SaaS builder">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0A0A0C"/>
      <stop offset="0.55" stop-color="#0C0C10"/>
      <stop offset="1" stop-color="#0F0F14"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E10600"/>
      <stop offset="1" stop-color="#FF7A00"/>
    </linearGradient>
    <linearGradient id="trace" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E10600" stop-opacity="0"/>
      <stop offset="0.25" stop-color="#E10600"/>
      <stop offset="1" stop-color="#FF7A00"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-60%" width="140%" height="220%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="check" width="22" height="22" patternUnits="userSpaceOnUse">
      <rect width="22" height="22" fill="#0A0A0C"/>
      <rect width="11" height="11" fill="#E9E9EE"/>
      <rect x="11" y="11" width="11" height="11" fill="#E9E9EE"/>
    </pattern>
    <clipPath id="round"><rect width="1200" height="300" rx="16"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1200" height="300" fill="url(#bg)"/>

    <!-- faint vertical speed grid -->
    <g stroke="#FFFFFF" stroke-opacity="0.035">
      <line x1="120" y1="0" x2="120" y2="300"/>
      <line x1="280" y1="0" x2="280" y2="300"/>
      <line x1="440" y1="0" x2="440" y2="300"/>
      <line x1="760" y1="0" x2="760" y2="300"/>
      <line x1="920" y1="0" x2="920" y2="300"/>
      <line x1="1080" y1="0" x2="1080" y2="300"/>
    </g>

    <!-- ghost number 1 (Verstappen) -->
    <text x="1085" y="252" font-family="'Arial Black','Segoe UI',sans-serif" font-size="320" font-weight="900" fill="#FFFFFF" fill-opacity="0.04" text-anchor="middle">1</text>

    <!-- checkered strip, right edge -->
    <rect x="1176" y="0" width="24" height="300" fill="url(#check)" opacity="0.85"/>
    <!-- accent bar, left edge -->
    <rect x="0" y="0" width="8" height="300" fill="url(#accent)"/>

    <!-- telemetry trace -->
    <g filter="url(#glow)">
      <polyline fill="none" stroke="url(#trace)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"
        points="40,235 120,232 175,210 215,214 270,150 320,168 380,120 430,138 500,96 560,150 620,128 700,172 770,150 840,196 900,180 980,206 1060,200 1140,224">
        <animate attributeName="stroke-dasharray" from="0 2000" to="2000 0" dur="2.6s" begin="0s" fill="freeze"/>
      </polyline>
      <circle r="4.5" fill="#FF7A00">
        <animateMotion dur="3.2s" repeatCount="indefinite" rotate="auto"
          path="M40,235 L120,232 L175,210 L215,214 L270,150 L320,168 L380,120 L430,138 L500,96 L560,150 L620,128 L700,172 L770,150 L840,196 L900,180 L980,206 L1060,200 L1140,224"/>
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.05;0.95;1" dur="3.2s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- eyebrow -->
    <g font-family="'JetBrains Mono','Cascadia Code',Consolas,'SFMono-Regular',monospace">
      <rect x="40" y="58" width="9" height="9" fill="#E10600"/>
      <text x="60" y="67" font-size="14" letter-spacing="5" fill="#9A9AA2">FULL-STACK&#160;&#160;DEVELOPER&#160;&#160;&#183;&#160;&#160;SAAS&#160;BUILDER</text>

      <!-- name -->
      <text x="38" y="150" font-size="74" font-weight="800" letter-spacing="-2" fill="#F4F4F6">Tkyo<tspan fill="url(#accent)">_0x</tspan><tspan fill="#E10600">
        <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite"/>_</tspan></text>

      <!-- tagline -->
      <text x="42" y="196" font-size="17" fill="#C2C2CA">P1 mindset &#8212; <tspan fill="#FF7A00">build fast</tspan>, ship clean.</text>

      <!-- meta row -->
      <g font-size="13" fill="#7C7C85" letter-spacing="1">
        <text x="42" y="252">&#9654; LATAM</text>
        <text x="150" y="252">&#9654; UTC&#8722;05:00</text>
        <text x="300" y="252">&#9654; Next.js &#183; Supabase &#183; Expo</text>
      </g>

      <!-- lap/telemetry chip, top-right -->
      <g transform="translate(880,46)">
        <rect x="0" y="0" width="270" height="34" rx="8" fill="#101015" stroke="#26262C"/>
        <circle cx="20" cy="17" r="4" fill="#16E06A"><animate attributeName="opacity" values="1;0.25;1" dur="1.4s" repeatCount="indefinite"/></circle>
        <text x="34" y="22" font-size="12.5" letter-spacing="1.5" fill="#B7B7BF">STATUS&#160;&#160;<tspan fill="#16E06A">SHIPPING</tspan>&#160;&#160;&#183;&#160;&#160;LAP&#160;&#8734;</text>
      </g>
    </g>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="299" rx="16" fill="none" stroke="#1C1C22"/>
</svg>
