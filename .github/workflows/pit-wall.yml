name: Pit wall

on:
  schedule:
    - cron: "17 */8 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/**"
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: pit-wall
  cancel-in-progress: false

jobs:
  live:
    if: github.event_name != 'issues' || contains(github.event.issue.title, 'parrilla')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install font tools
        run: pip install --quiet fonttools

      - name: Restore grid
        run: |
          mkdir -p dist
          if git fetch --depth=1 origin output 2>/dev/null; then
            git show FETCH_HEAD:grid.json > dist/grid.json 2>/dev/null || rm -f dist/grid.json
          fi

      - name: Build live panels
        env:
          GH_TOKEN: ${{ secrets.PROFILE_TOKEN || github.token }}
          JOINER: ${{ github.event_name == 'issues' && github.event.issue.user.login || '' }}
        run: |
          if [ -n "$JOINER" ]; then
            node scripts/build.mjs --live dist --join "$JOINER"
          else
            node scripts/build.mjs --live dist
          fi

      - name: Contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?palette=github-dark&color_snake=#FFC906&color_dots=#0F1730,#3B1238,#7A0E33,#B8072F,#E4002B

      - name: Publish to output branch
        run: |
          cd dist
          git init -q
          git checkout -q -b output
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "pit wall: live panels"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" output

      - name: Welcome to the grid
        if: github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          NUM: ${{ github.event.issue.number }}
          LOGIN: ${{ github.event.issue.user.login }}
        run: |
          gh issue comment "$NUM" --repo "$GITHUB_REPOSITORY" --body "¡Listo, @$LOGIN! Ya estás en la parrilla de salida 🏁 En un par de minutos aparecerás en el perfil. Gracias por pasar por el pit."
          gh issue close "$NUM" --repo "$GITHUB_REPOSITORY"
