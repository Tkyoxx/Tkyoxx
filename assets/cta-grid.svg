<svg xmlns="http://www.w3.org/2000/svg" width="520" height="84" viewBox="0 0 520 84" fill="none" role="img" aria-label="Toma tu lugar en la parrilla">
<title>Toma tu lugar en la parrilla</title>
<style>@font-face{font-family:'TkDisplay';src:url(data:font/woff;base64,) format('woff');}@font-face{font-family:'TkMonoB';src:url(data:font/woff;base64,) format('woff');}.display{font-family:'TkDisplay','Arial Black', Impact, sans-serif;}.monob{font-family:'TkMonoB',Consolas, 'Courier New', monospace;}
text{font-kerning:normal;}
.spin,.grow,.pulse,.fb{transform-box:fill-box;transform-origin:center;}

.sh{animation:sh 3.6s ease-in-out infinite;}
@keyframes sh{0%,55%{transform:translateX(-160px)}100%{transform:translateX(680px)}}
.pulse{animation:pulse 1.6s ease-in-out infinite;}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.7)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;}}
</style>
<defs>
<clipPath id="card"><rect width="520" height="84" rx="18"/></clipPath>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E4002B"/><stop offset="1" stop-color="#9E0020"/></linearGradient>
<linearGradient id="shg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".35"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<radialGradient id="glowR" cx=".15" cy="0" r="1.1"><stop offset="0" stop-color="#FFC906" stop-opacity=".55"/><stop offset="1" stop-color="#FFC906" stop-opacity="0"/></radialGradient>
</defs>
<g clip-path="url(#card)">
<rect width="520" height="84" fill="url(#bg)"/>
<rect width="520" height="84" fill="url(#glowR)"/>
